    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:category_ads_all": 
      - rcode://success
    "rule-set:google_domain":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "rule-set:cn_domain,private_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-detect-interface: true
  auto-route: true
  auto-redirect: false
  strict-route: true
  mtu: 1400
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.apple.com"
    - "+.push.apple.com"
    - "+.icloud.com"
proxies:
  - name: 🇨🇦 tuic
    server: 198.46.177.81
    port: 443
    type: tuic
    uuid: a41964c0-7455-46bc-9a99-6481396a2f6a
    password: hpmrfyfRzyOC
    sni: bing.com
    alpn: [h3]
    request-timeout: 8000
    udp-relay-mode: native
