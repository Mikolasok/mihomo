mixed-port: 10801
allow-lan: true
bind-address: "*"
authentication: 
  - "D&5gqmaW%SbFbbAW^8:BNEr7dxCA5szwI#W8g"
skip-auth-prefixes: 
  - 127.0.0.1/8
  - ::1/128
mode: rule
log-level: info
ipv6: true
find-process-mode: strict
external-controller: 127.0.0.1:16254
secret: "2ZfQP2pN!OwD!5h6XC"
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
  respect-rules: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.home.arpa"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:category_ads_all": 
      - rcode://success
    "rule-set:google_domain":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "rule-set:cn_domain,private_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-detect-interface: true
  auto-route: true
  auto-redirect: false
  strict-route: true
  mtu: 1400
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.apple.com"
    - "+.push.apple.com"
    - "+.icloud.com"
proxies:
  - name: 🇺🇸 DMIT
    type: anytls
    server: example.com
    port: 443
    password: "password"
    client-fingerprint: chrome
    udp: true
    sni: example.com
    alpn:
      - h2
      - http/1.1
    skip-cert-verify: false
    name-cert-verify: example.com
    ech-key: |-
      -----BEGIN ECH KEYS-----
      ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
      madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
      dC5jb20AAA==
      -----END ECH KEYS-----
    jls-opts:
      username: "username"
      password: "password"
  - name: 🇩🇪 ShanDun
    type: anytls
    server: example.com
    port: 443
    password: "password"
    client-fingerprint: chrome
    udp: true
    sni: example.com
    alpn:
      - h2
      - http/1.1
    skip-cert-verify: false
    name-cert-verify: example.com
    ech-key: |-
      -----BEGIN ECH KEYS-----
      ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
      madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
      dC5jb20AAA==
      -----END ECH KEYS-----
    jls-opts:
      username: "username"
      password: "password"
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - 🇺🇸 DMIT
      - auto
  - name: Binance
    type: select
    proxies:
      - 🇩🇪 ShanDun
  - name: Bybit
    type: select
    proxies:
      - 🇩🇪 ShanDun
  - name: auto
    type: url-test
    proxies:
      - 🇺🇸 DMIT
      - 🇩🇪 ShanDun
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
rules:
  - RULE-SET,category_ads_all,REJECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,binance_domain,Binance
  - RULE-SET,bybit_domain,Bybit
  - RULE-SET,google_domain,Proxy
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,cn_ip,DIRECT
  - MATCH,Proxy
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
rule-providers:
  google_domain:
    type: inline
    behavior: domain
    format: yaml
    payload:
      - "+.googleapis.cn"
      - "+.xn--ngstr-lra8j.com"
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
  binance_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/binance.mrs"
  bybit_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bybit.mrs"
  category_ads_all:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
  cn_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
